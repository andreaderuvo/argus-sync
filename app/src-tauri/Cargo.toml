[package]
name = "argus-sync-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "argus-sync: a folder of an Argus server, kept in sync with a folder on this computer"

# Its own workspace: it needs the GUI toolkits of the system it is built on (WebKitGTK on Linux),
# which the engine and the CLI do not.
[workspace]

[lib]
name = "argus_sync_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argus-sync-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
trash = "5"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
