# Every change: the engine's tests on macOS, Windows and Linux (the cross-OS rules are only proven
# where they apply), and the app built for all three. A tag v* also publishes the installers.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# Creating the release with the installers needs to write to the repository.
permissions:
  contents: write

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests (names, plan, links)
        run: cargo test -p argus-sync-core --lib
      - name: Against a real Argus
        if: runner.os != 'Windows'      # Argus itself runs on Linux and macOS
        shell: bash
        run: |
          git clone --depth 1 https://github.com/andreaderuvo/argus.git ../argus-src
          pip install fastapi uvicorn pyyaml httpx
          ARGUS_SRC=$PWD/../argus-src cargo test -p argus-sync-core --test against_argus
      - name: The command-line client
        run: cargo build --release -p argus-sync-cli
      - uses: actions/upload-artifact@v4
        with:
          name: argus-sync-cli-${{ matrix.os }}
          path: |
            target/release/argus-sync
            target/release/argus-sync.exe

  app:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux toolkits
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: argus-sync ${{ github.ref_name }}
          releaseDraft: false
      # Every build's installers, downloadable from the run's page (a tag also attaches them to a release).
      - uses: actions/upload-artifact@v4
        with:
          name: argus-sync-app-${{ runner.os }}
          path: |
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/appimage/*.AppImage
            app/src-tauri/target/**/release/bundle/deb/*.deb
            app/src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: error

  window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pip install pytest websockets
      - run: ARGUS_CHROMIUM=${{ steps.chrome.outputs.chrome-path }} python -m pytest -q tests/ui
